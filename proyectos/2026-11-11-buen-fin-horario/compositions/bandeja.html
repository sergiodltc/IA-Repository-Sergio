    // Fase 1: llegan correos (Tu marca está entre las primeras)
    const first = ["#ban-r1", "#ban-r2", "#ban-tu"];
    first.forEach((id, i) => {
      tl.fromTo(id, { y: TOP + i * ROW - 30, opacity: 0 }, { y: TOP + i * ROW, opacity: 1, duration: 0.3, ease: "power2.out" }, 0.3 + i * 0.25);

    // Fase 2: "todas las marcas mandan a la misma hora": llegan arriba y empujan hacia abajo.

    let order = ["#ban-r1", "#ban-r2", "#ban-tu"];
    late.forEach(([id, t]) => {
      order = [id, ...order];
      order.forEach((rid, i) => {
        if (rid === id) {
          tl.fromTo(id, { y: TOP - 30, opacity: 0 }, { y: TOP, opacity: 1, duration: 0.3, ease: "power2.out" }, t);
        } else {
          tl.to(rid, { y: TOP + i * ROW, duration: 0.3, ease: "power2.out" }, t);
        }
      });
    });

    // Contador de correos a las 9:00
    const counter = { n: 0 };

    // Fase 3: saturado + tu correo se hunde y se apaga
